[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra_tools"
version = "2.0.0"
description = "Automated setup scripts for remote Linux systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
completion = ["argcomplete>=3.0.0"]
dev = ["coverage>=7.0"]

[project.scripts]
infra-tools = "infra_tools:main"
webhook_manager = "web.service_tools.webhook_manager:main"

[tool.setuptools]
py-modules = ["infra_tools", "remote_setup"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "deploy*",
    "desktop*",
    "game*",
    "lib*",
    "plugins*",
    "security*",
    "smb*",
    "sync*",
    "web*",
]
exclude = [
    "*.__pycache__",
    "*.__pycache__.*",
]
namespaces = true

[tool.setuptools.package-data]
common = ["agent_skills/*/SKILL.md"]
desktop = ["config/*.template"]
web = ["config/*"]
