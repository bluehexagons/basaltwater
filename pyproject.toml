[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basaltwater"
version = "2.0.0"
description = "Basaltwater: infrastructure management, from one machine to your whole network"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/bluehexagons/infra_tools"
Documentation = "https://github.com/bluehexagons/infra_tools/blob/main/docs/README.md"
Issues = "https://github.com/bluehexagons/infra_tools/issues"

[project.optional-dependencies]
completion = ["argcomplete>=3.0.0"]
dev = ["coverage>=7.0"]

[project.scripts]
basaltw = "basaltwater:main"
webhook_manager = "web.service_tools.webhook_manager:main"

[tool.setuptools]
py-modules = ["basaltwater", "remote_setup"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "deploy*",
    "desktop*",
    "game*",
    "lib*",
    "plugins*",
    "security*",
    "smb*",
    "sync*",
    "web*",
]
exclude = [
    "*.__pycache__",
    "*.__pycache__.*",
]
namespaces = true

[tool.setuptools.package-data]
common = ["agent_skills/*/SKILL.md"]
desktop = ["config/*.template"]
web = ["config/*"]
