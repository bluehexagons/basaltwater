name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  schedule:
    # Keep a visible default-branch baseline even when no PR is open (UTC).
    - cron: '23 5 * * *'

permissions:
  contents: read

# A newer revision replaces obsolete checks for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  latest-package:
    name: Latest platform packaging / Python 3.15 (Ubuntu 26.04)
    # Exercise current Linux/Python packaging natively. Ubuntu's Python builds
    # cannot be mounted into Trixie when they require a newer glibc.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install build tooling
        run: python3 -m pip install --disable-pip-version-check build

      - name: Check package metadata and installed wheel
        run: make package-check artifact-check

  test:
    name: ${{ matrix.check-name }} / Node ${{ matrix.node-version }} (Debian Trixie)
    # Tool-cache Python and Node are mounted into Debian Trixie; keep their
    # runtime ABI compatible with the container's glibc.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Run all checks and coverage once. Repeat the JavaScript behavior
        # checks on the other supported Node major, in the same Debian image.
        include:
          - python-version: '3.13'
            node-version: '24.22.1'
            check-name: Full validation
            check-mode: --coverage
            check-jobs: 2
          - python-version: '3.13'
            node-version: '26.12.1'
            check-name: Node compatibility
            check-mode: --node-only
            check-jobs: 1
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # A normal step can recover from registry limits; job-container
      # initialization fails before any fallback step can execute.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Debian checks
        id: debian
        env:
          BASALTWATER_CI_PYTHON: ${{ steps.python.outputs.python-path }}
          BASALTWATER_CI_MODE: ${{ matrix.check-mode }}
          BASALTWATER_CI_CHECK_JOBS: ${{ matrix.check-jobs }}
        run: python3 scripts/run_debian_ci.py --python "$BASALTWATER_CI_PYTHON" --tool-cache "$RUNNER_TOOL_CACHE" --node "$(command -v node)" "$BASALTWATER_CI_MODE" --check-jobs "$BASALTWATER_CI_CHECK_JOBS"

      - name: Summarize test measurements
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.debian.outcome }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          report = Path('artifacts/test-timings.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Debian checks: **{os.environ['CHECK_OUTCOME'] or 'not started'}**\n\n")
              if report.is_file():
                  data = json.loads(report.read_text())
                  summary.write(f"{data['tests_run']} tests; {data['skipped']} skipped; "
                                f"{data['failures']} failures; {data['errors']} errors.\n\n")
                  summary.write(f"Suite elapsed: {data['suite_seconds']:.3f}s; "
                                f"outside test cases: {data['outside_test_case_seconds']:.3f}s.\n\n")
                  summary.write('See Run Debian checks for ranked module and test timings.\n')
              else:
                  summary.write('No timing report: checks did not reach a completed test run.\n')
          PY

      - name: Retain test measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-python-${{ matrix.python-version }}-node-${{ matrix.node-version }}
          path: artifacts/test-timings.json
          if-no-files-found: ignore
          retention-days: 14
