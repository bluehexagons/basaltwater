name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer revision replaces obsolete checks for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} (Debian Trixie)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Trixie ships Python 3.13; keep routine branch and PR checks focused
        # on the interpreter used by the supported Debian CI environment.
        python-version: ['3.13']
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      # A normal step can recover from registry limits; job-container
      # initialization fails before any fallback step can execute.
      - name: Run Debian checks and coverage
        env:
          BASALTWATER_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 scripts/run_debian_ci.py --python "$BASALTWATER_CI_PYTHON" --tool-cache "$RUNNER_TOOL_CACHE" --coverage
