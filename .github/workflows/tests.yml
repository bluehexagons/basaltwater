name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer revision replaces obsolete checks for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Node ${{ matrix.node-version }} (Debian Trixie)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Trixie ships Python 3.13; keep routine branch and PR checks focused
        # on the interpreter used by the supported Debian CI environment.
        python-version: ['3.13']
        node-version: ['24.22.1', '26.12.1']
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # A normal step can recover from registry limits; job-container
      # initialization fails before any fallback step can execute.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Debian checks and coverage
        env:
          BASALTWATER_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 scripts/run_debian_ci.py --python "$BASALTWATER_CI_PYTHON" --tool-cache "$RUNNER_TOOL_CACHE" --node "$(command -v node)" --coverage
